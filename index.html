<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Woltar — Archives Vivantes. Vitrine RP privée : personnages, lieux, clans et histoires de l'univers Woltar." />
    <meta name="color-scheme" content="dark light" />
    <title>Woltar | Archives Vivantes</title>
    <script>
      // Pose le thème avant le premier rendu (pas de flash).
      (function () {
        try {
          var t = localStorage.getItem('woltar-theme')
          if (t !== 'light' && t !== 'dark' && t !== 'woltar') {
            // 'woltar' n'est jamais déduit des préférences système : seulement
            // choisi via le sélecteur, puis mémorisé (voir src/theme.js).
            t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
          }
          document.documentElement.dataset.theme = t
        } catch (e) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
